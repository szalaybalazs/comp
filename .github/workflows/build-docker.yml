
name: Build Comp AI Docker Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - app
          - portal
          - migrator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        id: owner
        run: |
          echo "name=${GITHUB_REPOSITORY_OWNER,,}" \
            >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true

          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/comp-${{ matrix.target }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/comp-${{ matrix.target }}:${{ github.sha }}

          build-args: |
            NEXT_PUBLIC_BETTER_AUTH_URL=http://100.66.142.89:3000
            NEXT_PUBLIC_PORTAL_URL=http://100.66.142.89:3002
            NEXT_PUBLIC_SELF_HOSTED=true

          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
